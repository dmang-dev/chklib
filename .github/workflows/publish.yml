name: publish

# Publishing is driven by creating a GitHub Release. Nothing publishes on a
# plain push, so a merge can never put a version on PyPI by accident.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The lowest version the package supports, so mypy resolves the same
          # stdlib signatures a 3.10 user gets rather than a newer one's.
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Both are pinned by pyproject, so a rule set cannot drift underneath a
      # release. --output-format=github annotates the diff on a pull request.
      - run: python -m ruff check --output-format=github src/ tests/ tools/
      - run: python -m mypy

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in its classifiers.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # The tests needing real StarCraft maps skip here, since CI has no
      # installation. Everything else runs, which is most of the suite.
      - run: python -m pytest

  build:
    name: build distributions
    # Both gates, not just the tests: a lint or typing failure should stop a
    # release as surely as a failing test, since the version is spent either way.
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      # Catches a README that will not render on PyPI, which cannot be fixed
      # after upload because a version number can never be reused.
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for Trusted Publishing: the job mints a short-lived OIDC token
      # instead of using a stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
